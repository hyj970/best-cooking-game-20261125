<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle Line — a short-order kitchen rush</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #241a12;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #game {
    width: min(96vw, 960px);
    height: auto;
    aspect-ratio: 960 / 600;
    display: block;
    border-radius: 8px;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55);
    image-rendering: auto;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="600"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
